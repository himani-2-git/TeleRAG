name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit test suite
        run: |
          python -m unittest discover tests

      - name: Run retrieval evaluation quality gate
        run: |
          python eval/run_eval.py \
            --mode hybrid \
            --pdf eval/fixtures/ci_fixture.pdf \
            --golden eval/golden_ci.json \
            --thresholds eval/thresholds.json

      - name: Run grounding evaluation quality gate
        run: |
          python eval/run_grounding_gate.py \
            --pdf eval/fixtures/ci_fixture.pdf \
            --answers eval/fixtures/ci_answers.json \
            --thresholds eval/thresholds.json
